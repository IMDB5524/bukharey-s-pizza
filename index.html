<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bukharey’s Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --surface:#FBF4EC; --ink:#2A1E17; --muted:#76665B; --line:#ECDDD0;
  --chili:#D7261E; --on-chili:#FFFFFF; --basil:#1F5C3A; --on-basil:#FFFFFF; --saffron:#F2B705; --focus:#1F5C3A;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A1411; --surface:#251C16; --ink:#F5ECE5; --muted:#B9A79A; --line:#3B2E26;
    --chili:#F0473C; --on-chili:#FFFFFF; --basil:#6CC896; --on-basil:#10261A; --saffron:#FFC93C; --focus:#6CC896;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1411; --surface:#251C16; --ink:#F5ECE5; --muted:#B9A79A; --line:#3B2E26;
  --chili:#F0473C; --on-chili:#FFFFFF; --basil:#6CC896; --on-basil:#10261A; --saffron:#FFC93C; --focus:#6CC896;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font:800 1.3rem/1 var(--display);letter-spacing:-.02em}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:500;margin-top:2px}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav a{text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--muted)}
.topnav a[aria-current="page"]{color:var(--ink);background:var(--surface)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;background:var(--chili);color:var(--on-chili);text-decoration:none;padding:9px 16px;border-radius:999px;font-weight:700}
.cartbtn .n{background:var(--on-chili);color:var(--chili);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.8rem;padding:0 6px}
.acct-m{display:none;margin-left:auto;text-decoration:none;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line)}

/* Tab bar (mobile) */
.tabs{display:none}
@media (max-width:760px){
  .topnav,.cartbtn{display:none}
  .acct-m{display:inline-block}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
  .tabs a svg{width:24px;height:24px}
  .tabs a[aria-current="page"]{color:var(--chili)}
  .tabs .dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--chili);color:var(--on-chili);font-size:.66rem;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
  main{padding-bottom:96px!important}
}

main{max-width:1120px;margin:0 auto;padding:24px 20px 64px}
.view{display:none}
.view.on{display:block}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;line-height:1.1}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}

/* Hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;padding:12px 0 36px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2.6rem,8vw,5.2rem);font-weight:800;line-height:.92;letter-spacing:-.045em}
.hero p.lede{font-size:1.15rem;max-width:34ch;margin-top:18px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;font-weight:600;font-size:.95rem}
.status i{width:10px;height:10px;border-radius:50%;background:var(--basil)}
.status.closed i{background:var(--muted)}
.hero-art{position:relative;justify-self:center;width:min(100%,420px)}
.hero-art svg{width:100%;height:auto;transform:rotate(-8deg)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-art{width:70%;order:-1;margin-top:-8px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 20px;background:var(--chili);color:var(--on-chili);font-size:1rem}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.green{background:var(--basil);color:var(--on-basil)}
.btn.sm{padding:8px 14px;font-size:.9rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--chili);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Menu */
.chips{display:flex;gap:8px;overflow-x:auto;padding:24px 0 8px;scrollbar-width:none}
.chips a{flex:none;text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:.95rem}
.sec{padding-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.pz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 24px}
.pz-item{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.pz-item svg{width:96px;height:96px}
.pz-item h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font:600 .72rem/1 var(--body);background:var(--chili);color:var(--on-chili);padding:4px 8px;border-radius:999px}
.pz-item p{font-size:.92rem;color:var(--muted);margin:4px 0 10px}
.price{font-weight:700}
.row-list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row .em{font-size:1.8rem;text-align:center}
.row p{font-size:.9rem;color:var(--muted)}
.foot{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;font-size:.95rem}
.foot h3{margin-bottom:6px}

/* Dialog */
dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(20,12,8,.55)}
.dlg{padding:22px;display:grid;gap:18px}
.dlg-top{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.dlg-top svg{width:120px;height:120px}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:1.3rem}
fieldset{border:0;margin:0;padding:0}
legend{font-weight:700;margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-block;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:.92rem;background:var(--paper)}
.opt input:checked + span{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opt input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.opt small{font-weight:500;opacity:.75}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.qty button{width:38px;height:38px;border:0;background:none;cursor:pointer;font-size:1.2rem;font-weight:700}
.qty span{min-width:28px;text-align:center;font-weight:700}
.dlg-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:36px;align-items:start;margin-top:20px}
.b-art{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);text-align:center}
.b-art svg{width:min(100%,400px);height:auto}
.b-total{font:800 2rem/1 var(--display);margin-top:12px}
.b-form{display:grid;gap:26px}
@media (max-width:760px){.builder{grid-template-columns:1fr;gap:20px}.b-art{position:static}.b-art svg{width:62%}}
.sticky-add{position:sticky;bottom:12px;background:var(--paper);padding:12px;border:1px solid var(--line);border-radius:16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
@media (max-width:760px){.sticky-add{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}

/* Cart */
.cart{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:start;margin-top:20px}
@media (max-width:860px){.cart{grid-template-columns:1fr;gap:28px}}
.ci{display:grid;grid-template-columns:56px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.ci svg{width:56px;height:56px}
.ci .em{font-size:2rem;text-align:center}
.ci p{font-size:.88rem;color:var(--muted)}
.ci-r{text-align:right;display:grid;gap:8px;justify-items:end}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:999px;padding:4px}
.seg button{border:0;border-radius:999px;padding:10px;font-weight:700;background:none;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.92rem}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper)}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:.82rem;color:var(--muted)}
.field.err input,.field.err select{border-color:var(--chili)}
.errmsg{color:var(--chili);font-size:.85rem;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border-radius:20px;padding:22px}
.sum{display:grid;gap:8px;margin:16px 0}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font:800 1.35rem/1.2 var(--display);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--basil)}
.empty{padding:48px 0;text-align:center;display:grid;gap:14px;justify-items:center}
.empty svg{width:140px;height:140px;opacity:.9}
.note{font-size:.85rem;color:var(--muted)}

/* Tracker */
.trk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:36px;align-items:center;margin-top:16px}
@media (max-width:760px){.trk{grid-template-columns:1fr;gap:16px}}
.trk-art{text-align:center}
.trk-art svg{width:min(100%,320px);height:auto}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.trk h2{font-size:clamp(2rem,6vw,3.2rem)}
.steps{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;padding-bottom:16px;position:relative}
.steps li::before{content:"";position:absolute;left:15px;top:30px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--basil)}
.steps .b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;border:2px solid var(--line);background:var(--paper);position:relative;z-index:1}
.steps li.done .b{background:var(--basil);border-color:var(--basil);color:var(--on-basil)}
.steps li.now .b{border-color:var(--chili);color:var(--chili)}
.steps li.now strong{color:var(--chili)}
.steps .bar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden;max-width:220px}
.steps .bar i{display:block;height:100%;background:var(--chili)}
.hist{margin-top:44px}
.ho{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.ho p{font-size:.9rem;color:var(--muted)}
.ho-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* Rewards */
.rw{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;margin-top:16px}
@media (max-width:760px){.rw{grid-template-columns:1fr;justify-items:center;text-align:center;gap:16px}}
.rw-ring{position:relative;width:240px;height:240px}
.rw-ring svg{width:240px;height:240px}
.rw-ring .pts{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rw-ring .pts b{font:800 3.4rem/1 var(--display)}
.how{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.how h3{margin-bottom:4px}

/* Account */
.acct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;margin-top:20px;align-items:start}
@media (max-width:760px){.acct{grid-template-columns:1fr}}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle p{font-size:.88rem;color:var(--muted)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked + span{background:var(--basil)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.owner{margin-top:8px}
.owner dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0 0}
.owner dt{color:var(--muted)}
.owner dd{margin:0;font-weight:600;word-break:break-word}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#menu" aria-label="Bukharey’s Pizza home">
      <svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="23" fill="#D7261E"/>
        <path d="M24 24 L24 4 A20 20 0 0 1 41.3 14 Z" fill="#F2B705"/>
        <circle cx="29" cy="11" r="2.2" fill="#D7261E"/><circle cx="34" cy="15" r="1.6" fill="#1F5C3A"/>
        <text x="21" y="36" text-anchor="middle" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">B</text>
      </svg>
      <span><b>Bukharey’s Pizza</b><small>Inglewood, CA</small></span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="#menu">Menu</a>
      <a href="#build">Build your own</a>
      <a href="#track">Track order</a>
      <a href="#rewards">Rewards</a>
      <a href="#account">Account</a>
    </nav>
    <a class="cartbtn" href="#cart" aria-label="Cart">Cart <span class="n" data-count>0</span></a>
    <a class="acct-m" href="#account">Account</a>
  </div>
</header>

<main id="main">
  <section class="view" id="v-menu" aria-label="Menu"></section>
  <section class="view" id="v-build" aria-label="Build your own pizza"></section>
  <section class="view" id="v-cart" aria-label="Cart and checkout"></section>
  <section class="view" id="v-track" aria-label="Track your order"></section>
  <section class="view" id="v-rewards" aria-label="Rewards"></section>
  <section class="view" id="v-account" aria-label="Account"></section>
</main>

<nav class="tabs" aria-label="Main">
  <a href="#menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 20h20Z"/><circle cx="12" cy="13" r="1.5"/><circle cx="9" cy="17" r="1"/><circle cx="15" cy="17" r="1"/></svg>Menu</a>
  <a href="#build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Build</a>
  <a href="#cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>Cart<span class="dot" data-count hidden>0</span></a>
  <a href="#track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>Track</a>
  <a href="#rewards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg>Rewards</a>
</nav>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Store details ---------- */
const STORE = {
  name: 'Bukharey’s Pizza',
  owner: 'Imam Muhammad Bukharey',
  phone: '213-436-8392',
  phoneHref: '+12134368392',
  email: 'imambukharey01@gmail.com',
  city: 'Inglewood, CA',
  openMin: 10*60 + 30,   // 10:30 am
  closeMin: 23*60        // 11:00 pm
};
const TAX = 0.1025;          // estimated Inglewood sales tax
const DELIVERY_FEE = 3.99;
const DELIVERY_MIN = 10;
const REWARD_COST = 60;
const POINTS_PER_ORDER = 10;

/* ---------- Catalog ---------- */
const SIZES = {S:{label:'Small 10"',price:9.99}, M:{label:'Medium 12"',price:12.99}, L:{label:'Large 14"',price:15.99}};
const CRUSTS = {hand:{label:'Hand-tossed',price:0}, thin:{label:'Thin & crispy',price:0}, pan:{label:'Deep pan',price:1.5}, garlic:{label:'Garlic butter crust',price:1}};
const SAUCES = {tomato:{label:'Tomato',color:'#C8321E'}, masala:{label:'Butter masala',color:'#E0782C'}, garlic:{label:'Garlic white',color:'#EEDFC0'}, bbq:{label:'Smoky BBQ',color:'#7A2E1A'}, none:{label:'No sauce',color:null}};
const CHEESES = {regular:{label:'Regular',price:0}, light:{label:'Light',price:0}, extra:{label:'Extra',price:1.5}, none:{label:'No cheese',price:0}};
const TOPPINGS = {

  if (d.toDateString()===n.toDateString()) return 'Today'; if (d.toDateString()===tm.toDateString()) return 'Tomorrow';

/* ---------- Pizza drawing ---------- */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash(s){ let h=2166136261; for (const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
let clipN = 0;
function pizzaSVG(cfg, cls=''){
  const id = 'c' + (++clipN);
  const sauce = SAUCES[cfg.sauce] || SAUCES.tomato;
  let s = `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="50" cy="50" r="46"/></clipPath></defs>`;
  const crust = cfg.wellDone ? '#B87634' : '#D99A52';
  s += `<circle cx="50" cy="50" r="48" fill="${crust}"/><circle cx="50" cy="50" r="46.5" fill="none" stroke="${cfg.wellDone?'#8E5622':'#BE7C3C'}" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  s += `<circle cx="50" cy="50" r="41" fill="${sauce.color || '#EBC88E'}"/>`;
  if (cfg.cheese !== 'none'){
    const op = cfg.cheese==='light' ? .5 : cfg.cheese==='extra' ? 1 : .85;
    s += `<circle cx="50" cy="50" r="39" fill="${cfg.wellDone?'#EFC45E':'#F6D776'}" opacity="${op}"/>`;
    const R = rng(hash('cheese'+cfg.cheese));
    for (let i=0;i<6;i++){ const a=R()*Math.PI*2, d=Math.sqrt(R())*30; s+=`<circle cx="${(50+Math.cos(a)*d).toFixed(1)}" cy="${(50+Math.sin(a)*d).toFixed(1)}" r="${(3+R()*4).toFixed(1)}" fill="#FBE7A6" opacity="${op*.7}"/>`; }
  }
  (cfg.toppings||[]).forEach((t, ti) => {
    const T = TOPPINGS[t]; if (!T) return;
    const R = rng(hash(t + ti));
    const n = (cfg.double||[]).includes(t) ? 15 : 8;
    for (let k=0;k<n;k++){
      const a=R()*Math.PI*2, d=4+Math.sqrt(R())*31, x=(50+Math.cos(a)*d).toFixed(1), y=(50+Math.sin(a)*d).toFixed(1), rot=(R()*180).toFixed(0);
      if (T.shape==='dot') s+=`<circle cx="${x}" cy="${y}" r="${T.r}" fill="${T.color}"/>`;
      else if (T.shape==='ring') s+=`<circle cx="${x}" cy="${y}" r="2.6" fill="none" stroke="${T.color}" stroke-width="1.6"/>`;
      else if (T.shape==='sliver') s+=`<rect x="${x-4}" y="${y-1}" width="8" height="2.2" rx="1.1" fill="${T.color}" transform="rotate(${rot} ${x} ${y})"/>`;
      else if (T.shape==='chunk') s+=`<rect x="${x-2.6}" y="${y-2.2}" width="5.2" height="4.4" rx="1.3" fill="${T.color}" transform="rotate(${rot} ${x} ${y})"/>`;
      else if (T.shape==='leaf') s+=`<ellipse cx="${x}" cy="${y}" rx="3.4" ry="1.7" fill="${T.color}" transform="rotate(${rot} ${x} ${y})"/>`;
    }
  });
  s += `<g clip-path="url(#${id})" stroke="rgba(60,30,10,.35)" stroke-width=".8">`;
  if (cfg.squareCut){ for (const v of [26,42,58,74]){ s+=`<line x1="${v}" y1="0" x2="${v}" y2="100"/><line x1="0" y1="${v}" x2="100" y2="${v}"/>`; } }
  else { for (let i=0;i<4;i++){ const a=i*Math.PI/4; s+=`<line x1="${(50+Math.cos(a)*48).toFixed(1)}" y1="${(50+Math.sin(a)*48).toFixed(1)}" x2="${(50-Math.cos(a)*48).toFixed(1)}" y2="${(50-Math.sin(a)*48).toFixed(1)}"/>`; } }
  s += `</g></svg>`;
  return s;
}

/* ---------- Pricing ---------- */
function specialtyPrice(p, size, crust){ return r2(SIZES[size].price + CRUSTS[crust].price + p.add); }
function customPrice(b){
  let t = SIZES[b.size].price + CRUSTS[b.crust].price + CHEESES[b.cheese].price;
  b.toppings.forEach(k => t += TOPPINGS[k].price);
  return r2(t);
}
function pizzaDetails(c){
  const bits = [SIZES[c.size].label, CRUSTS[c.crust].label];
  if (c.custom){
    bits.push(SAUCES[c.sauce].label + ' sauce');
    if (c.cheese!=='regular') bits.push(CHEESES[c.cheese].label + ' cheese');
    bits.push(c.toppings.length ? c.toppings.map(k=>TOPPINGS[k].label).join(', ') : 'No toppings');
  }
  if (c.wellDone) bits.push('Well done');
  if (c.squareCut) bits.push('Square cut');
  return bits.join(', ');
}

/* ---------- Store hours ---------- */
function minsOf(d){ return d.getHours()*60 + d.getMinutes(); }
function isOpen(d=new Date()){ const m=minsOf(d); return m>=STORE.openMin && m<STORE.closeMin; }
function asapAllowed(){ return S.demo || isOpen(); }
function slotList(){
  const out=[], earliest=Date.now()+45*60000;
  for (let day=0; day<2; day++){
    for (let m=STORE.openMin; m<=STORE.closeMin-15; m+=15){
      const d=new Date(); d.setDate(d.getDate()+day); d.setHours(0,m,0,0);
      if (d.getTime()>=earliest) out.push(d.getTime());
    }
  }
  return out;
}

/* ---------- Cart ---------- */
function cartCount(){ return S.cart.reduce((a,i)=>a+i.qty,0); }
function updateBadges(){
  const n = cartCount();
  $$('[data-count]').forEach(el => { el.textContent=n; if (el.classList.contains('dot')) el.hidden = n===0; });
}
function addToCart(item){
  const same = S.cart.find(i => !i.reward && !item.reward && i.key===item.key);
  if (same) same.qty += item.qty; else S.cart.push({...item, id:uid()});
  save(); updateBadges();
  toast(`Added ${item.qty>1?item.qty+' × ':''}${item.name}`);
}
function totals(){
  const subtotal = r2(S.cart.reduce((a,i)=>a+i.unit*i.qty,0));
  const promoOk = S.promo==='WELCOME10' && S.orders.length===0;
  const discount = promoOk ? r2(subtotal*0.10) : 0;
  const taxable = r2(subtotal-discount);
  const delivery = S.mode==='delivery' && subtotal>0 ? DELIVERY_FEE : 0;
  const tax = r2(taxable*TAX);
  const tip = S.mode==='delivery' ? r2(taxable*(S.draft.tip||0)) : 0;
  const total = r2(taxable+delivery+tax+tip);
  return {subtotal, discount, promoOk, taxable, delivery, tax, tip, total};
}

function readCheckout(){
  const f = $('#co'); if (!f) return;
  const g = n => f.elements[n] ? f.elements[n].value.trim() : '';
  S.profile.name = g('name'); S.profile.phone = g('phone'); S.profile.email = g('email');
  if (f.elements.address) S.profile.address = g('address');
  if (f.elements.apt) S.profile.apt = g('apt');
  S.draft.notes = g('notes');
  if (f.elements.slot) S.draft.slot = g('slot');
  S.draft.save = !!(f.elements.save && f.elements.save.checked);
  save();
}
function placeOrder(){
  readCheckout();
  const f = $('#co'), errs = [];
  $$('.field', f).forEach(x=>x.classList.remove('err'));
  const p = S.profile, del = S.mode==='delivery', t = totals();
  const mark = (k,msg) => { const el=$(`[data-f="${k}"]`,f); if (el) el.classList.add('err'); errs.push(msg); };
  if (p.name.length < 2) mark('name','Enter your name.');
  const digits = p.phone.replace(/\D/g,'');
  if (!(digits.length===10 || (digits.length===11 && digits[0]==='1'))) mark('phone','Enter a 10-digit US phone number.');
  if (p.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) mark('email','Check the email address.');
  if (del && p.address.length < 6) mark('address','Enter a delivery address.');
  if (del && t.taxable < DELIVERY_MIN) errs.push(`Delivery needs at least ${money(DELIVERY_MIN)} of food. Add a little more or switch to carryout.`);
  if (S.draft.when==='later' && !S.draft.slot) errs.push('Choose a time.');
  if (S.draft.when==='asap' && !asapAllowed()) errs.push('We’re closed right now. Schedule for later.');
  const reward = S.cart.find(i=>i.reward);
  if (reward && S.points < REWARD_COST) errs.push('You don’t have enough points for the reward pizza.');
  if (errs.length){ $('#co-err').textContent = errs.join(' '); const first=$('.field.err input',f); if (first) first.focus(); return; }

  const earned = t.taxable >= 10 ? POINTS_PER_ORDER : 0;
  const order = {
    id: String(Math.floor(1000 + Math.random()*9000)),
    placedAt: Date.now(),
    scheduledFor: S.draft.when==='later' ? +S.draft.slot : null,
    mode: S.mode, demo: S.demo,
    items: JSON.parse(JSON.stringify(S.cart)),
    totals: t, name: p.name, phone: p.phone, address: del ? [p.address, p.apt].filter(Boolean).join(', ') : '',
    notes: S.draft.notes, earned, used: reward ? REWARD_COST : 0
  };
  S.orders.unshift(order);
  S.points = S.points - order.used + earned;
  S.cart = []; S.promo = ''; S.draft.notes = ''; S.draft.when = 'asap';
  if (!S.draft.save) S.profile = {...DEFAULTS.profile};
  save(); updateBadges();
  location.hash = '#track';
  toast(order.scheduledFor ? 'Order scheduled' : 'Order placed');
}

/* ----- Tracker ----- */
function stagesFor(o){ const b=['Order placed','Prep','In the oven','Quality check']; return o.mode==='delivery' ? [...b,'Out for delivery','Delivered'] : [...b,'Ready for pickup']; }
function durs(o){ const d = o.demo ? [20,20,20,20,20].map(x=>x*1000) : [1,5,8,2,15].map(x=>x*60000); return o.mode==='delivery' ? d : d.slice(0,4); }
function progress(o){
  const ds = durs(o), lead = ds.reduce((a,b)=>a+b,0);
  const start = o.scheduledFor ? o.scheduledFor - lead : o.placedAt;
  const now = Date.now();
  if (now < start) return {waiting:true, start, eta:start+lead, i:0, frac:0, done:false};
  let t = now-start, i = 0;
  while (i<ds.length && t>=ds[i]){ t-=ds[i]; i++; }
  return {i, frac: i<ds.length ? t/ds[i] : 1, done: i>=ds.length, eta: start+lead};
}
const LINES = {
  'Order placed':'We’ve got it. Your order is in the queue.',
  'Prep':'Dough is being stretched and topped by hand.',
  'In the oven':'Baking now. This is the good part.',
  'Quality check':'Boxing it up and checking everything is right.',
  'Out for delivery':'Your driver is on the way.',
  'Delivered':'Delivered. Enjoy it while it’s hot.',
  'Ready for pickup':'Ready at the counter. Come and get it.'
};

  const v = $('#v-track');

  }
  const pr = progress(o), st = stagesFor(o);
  const cur = pr.done ? st[st.length-1] : st[pr.i];
  const firstPizza = o.items.find(i=>i.kind==='pizza');
  const head = pr.waiting ? `Scheduled for ${fmtTime(o.scheduledFor)}` : (cur==='In the oven' ? 'In the oven.' : cur + '.');
  const sub = pr.waiting ? `${fmtDay(o.scheduledFor)}. We’ll start making it at ${fmtTime(pr.start)} so it’s fresh when you want it.` : LINES[cur];
  const etaTxt = pr.done ? '' : `<p style="margin-top:10px;font-weight:600">${o.mode==='delivery'?'Arriving':'Ready'} around ${fmtTime(pr.eta)}</p>`;
  v.innerHTML = `

    <div class="trk">
      <div class="trk-art">${pizzaSVG(firstPizza ? firstPizza.cfg : {sauce:'tomato',cheese:'regular',toppings:[]}, (!pr.done && !pr.waiting && cur==='In the oven')?'spin':'')}</div>
      <div>
        <h2 aria-live="polite">${esc(head)}</h2>

        <ol class="steps">${st.map((name,idx)=>{
          const done = pr.done || idx < pr.i, now = !pr.done && idx===pr.i;
          return `<li class="${done?'done':''} ${now?'now':''}"><span class="b">${done?'✓':idx+1}</span><div><strong>${name}</strong>${now && !pr.waiting && idx<st.length-1?`<div class="bar"><i style="width:${Math.round(pr.frac*100)}%"></i></div>`:''}</div></li>`;
        }).join('')}</ol>
        ${o.demo?`<p class="note">Demo mode is on, so each step takes about 20 seconds. Turn it off in Account for real timings.</p>`:''}
        <div class="actions"><button class="btn alt sm" data-act="reorder" data-id="${o.id}">Order this again</button>
          <a class="btn alt sm" href="mailto:${STORE.email}?subject=${encodeURIComponent('Problem with order #'+o.id)}">Report a problem</a>
          <a class="btn alt sm" href="tel:${STORE.phoneHref}">Call the store</a></div>
      </div>
    </div>
    <div class="hist">
      <h2 style="font-size:1.5rem">Order history</h2>
      ${S.orders.map(x=>`
        <div class="ho">
          <div><h3>#${esc(x.id)}, ${fmtDay(x.placedAt)} at ${fmtTime(x.placedAt)}</h3>
            <p>${x.items.map(i=>`${i.qty} × ${esc(i.name)}${i.details?` (${esc(i.details)})`:''}`).join('; ')}</p>
            <p>${x.mode==='delivery'?'Delivery':'Carryout'}${x.scheduledFor?`, scheduled for ${fmtDay(x.scheduledFor)} ${fmtTime(x.scheduledFor)}`:''}, ${money(x.totals.total)}</p></div>
          <div class="ho-act"><button class="btn sm" data-act="reorder" data-id="${x.id}">Reorder</button></div>
        </div>`).join('')}
    </div>`;
}

function renderRewards(){
  const pts = S.points, pct = Math.min(1, (pts % REWARD_COST || (pts>=REWARD_COST?REWARD_COST:0)) / REWARD_COST);
  const ready = pts >= REWARD_COST;
  const slices = 6, filled = ready ? 6 : Math.floor(pct*slices + 1e-9);
  let ring = `<svg viewBox="0 0 100 100" aria-hidden="true">`;
  for (let i=0;i<slices;i++){
    const a0 = (i/slices)*Math.PI*2 - Math.PI/2 + .03, a1 = ((i+1)/slices)*Math.PI*2 - Math.PI/2 - .03;
    const p = (a,r)=>`${(50+Math.cos(a)*r).toFixed(2)} ${(50+Math.sin(a)*r).toFixed(2)}`;
    ring += `<path d="M50 50 L${p(a0,46)} A46 46 0 0 1 ${p(a1,46)} Z" fill="${i<filled?'#F2B705':'var(--line)'}" stroke="var(--paper)" stroke-width="1.5"/>`;
  }
  ring += `<circle cx="50" cy="50" r="30" fill="var(--paper)"/></svg>`;

/* ================= ROUTER ================= */
const VIEWS = ['menu','build','cart','track','rewards','account'];
function route(){
  let v = (location.hash||'').slice(1);
  if (!VIEWS.includes(v)) v = 'menu';
  VIEWS.forEach(x => $('#v-'+x).classList.toggle('on', x===v));
  $$('.topnav a, .tabs a').forEach(a => a.getAttribute('href')==='#'+v ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  clearInterval(trackTimer);
  ({menu:renderMenu, build:renderBuild, cart:renderCart, track:renderTrack, rewards:renderRewards, account:renderAccount})[v]();
  if (v==='track') trackTimer = setInterval(renderTrack, 1000);
  window.scrollTo(0,0);
}
function rerender(){ const v=(location.hash||'#menu').slice(1); if (v==='cart') renderCart(); }

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const jump = e.target.closest('[data-jump]');
  if (jump){ e.preventDefault(); const t=document.getElementById(jump.dataset.jump); if (t) t.scrollIntoView({behavior:'smooth'}); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a==='open-pizza') openPizza(id);
  else if (a==='close-dlg') $('#dlg').close();
  else if (a==='m-inc'){ M.qty=Math.min(20,M.qty+1); refreshPizzaDlg(); }
  else if (a==='m-dec'){ M.qty=Math.max(1,M.qty-1); refreshPizzaDlg(); }
  else if (a==='m-add'){
    const cfg = {sauce:M.p.sauce, cheese:M.p.cheese, toppings:M.p.toppings, double:M.p.double||[], size:M.size, crust:M.crust, wellDone:M.wellDone, squareCut:M.squareCut};
    addToCart({kind:'pizza', key:['sp',M.p.id,M.size,M.crust,M.wellDone,M.squareCut].join('|'), name:M.p.name, details:pizzaDetails(cfg), unit:specialtyPrice(M.p,M.size,M.crust), qty:M.qty, cfg});
    $('#dlg').close();
  }
  else if (a==='customize'){
    B = {size:M.size, crust:M.crust, sauce:M.p.sauce, cheese:M.p.cheese, toppings:[...M.p.toppings], wellDone:M.wellDone, squareCut:M.squareCut, qty:M.qty};
    $('#dlg').close(); if (location.hash==='#build') renderBuild(); else location.hash='#build';
  }
  else if (a==='add-extra'){
    const x = EXTRAS.find(z=>z.id===id);
    addToCart({kind:'item', key:'x|'+x.id, name:x.name, details:x.desc, unit:x.price, qty:1, em:x.em});
  }
  else if (a==='b-inc'){ B.qty=Math.min(20,B.qty+1); refreshBuild(); }
  else if (a==='b-dec'){ B.qty=Math.max(1,B.qty-1); refreshBuild(); }
  else if (a==='b-add'){
    const cfg = {...B, toppings:[...B.toppings], custom:true};
    delete cfg.qty;
    addToCart({kind:'pizza', key:'cu|'+JSON.stringify(cfg), name:'Your own pizza', details:pizzaDetails(cfg), unit:customPrice(B), qty:B.qty, cfg});
    B.qty = 1; refreshBuild();
  }
  else if (a==='inc' || a==='dec' || a==='rm'){
    readCheckout();
    const it = S.cart.find(i=>i.id===id); if (!it) return;
    if (a==='inc') it.qty = Math.min(20, it.qty+1);
    else if (a==='dec') it.qty -= 1;
    if (a==='rm' || it.qty<=0) S.cart = S.cart.filter(i=>i.id!==id);
    save(); updateBadges(); renderCart();
  }
  else if (a==='mode'){ readCheckout(); S.mode = el.dataset.v; save(); renderCart(); }
  else if (a==='place'){ e.preventDefault(); placeOrder(); }
  else if (a==='redeem'){
    if (S.points < REWARD_COST || S.cart.some(i=>i.reward)) return;
    const cfg = {sauce:'tomato', cheese:'regular', toppings:[], size:'M', crust:'hand'};
    S.cart.push({id:uid(), kind:'pizza', key:'reward', reward:true, name:'Free medium cheese pizza', details:pizzaDetails(cfg), unit:0, qty:1, cfg});
    save(); updateBadges(); toast('Reward added to your cart');
    if (location.hash==='#cart') renderCart(); else location.hash = '#cart';
  }
  else if (a==='reorder'){
    const o = S.orders.find(x=>x.id===id); if (!o) return;
    o.items.filter(i=>!i.reward).forEach(i => { const same=S.cart.find(c=>!c.reward && c.key===i.key); if (same) same.qty+=i.qty; else S.cart.push({...JSON.parse(JSON.stringify(i)), id:uid()}); });
    S.mode = o.mode; save(); updateBadges(); toast('Added to your cart. You can still choose a time.');
    location.hash = '#cart';
  }
  else if (a==='save-acct'){
    const f = $('#acct'); const g = n => f.elements[n].value.trim();
    const email = g('email');
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Check the email address'); return; }
    S.profile = {name:g('name'), phone:g('phone'), email, address:g('address'), apt:g('apt')};
    save(); toast('Details saved');
  }
  else if (a==='clear'){
    if (!confirm('Clear your cart, orders, points and saved details from this device?')) return;
    try{ localStorage.removeItem(KEY); }catch(_){}
    S = JSON.parse(JSON.stringify(DEFAULTS)); applyTheme(); updateBadges(); renderAccount(); toast('All data cleared');
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest('#dlg') && M){
    if (t.name==='m-size') M.size=t.value;
    if (t.name==='m-crust') M.crust=t.value;
    if (t.name==='m-well') M.wellDone=t.checked;
    if (t.name==='m-square') M.squareCut=t.checked;
    refreshPizzaDlg(); return;
  }
  if (t.closest('#b-form')){
    if (t.name==='b-size') B.size=t.value;
    if (t.name==='b-crust') B.crust=t.value;
    if (t.name==='b-sauce') B.sauce=t.value;
    if (t.name==='b-cheese') B.cheese=t.value;
    if (t.name==='b-top') B.toppings = $$('input[name="b-top"]:checked').map(x=>x.value);
    if (t.name==='b-well') B.wellDone=t.checked;
    if (t.name==='b-square') B.squareCut=t.checked;
    refreshBuild(); return;
  }
  if (t.closest('#co')){
    if (t.name==='when'){ readCheckout(); S.draft.when=t.value; save(); renderCart(); return; }
    if (t.name==='tip'){ readCheckout(); S.draft.tip=parseFloat(t.value); save(); renderCart(); return; }
    if (t.name==='promo'){ readCheckout(); S.promo=t.value.trim().toUpperCase(); save(); renderCart(); return; }
    readCheckout(); return;
  }
  if (t.dataset.act==='demo'){ S.demo=t.checked; save(); toast(S.demo?'Demo mode on':'Demo mode off'); }
  if (t.dataset.act==='theme'){ S.theme=t.value; save(); applyTheme(); }
});
document.addEventListener('input', e => { if (e.target.closest('#co') && e.target.name!=='promo') readCheckout(); });
$('#dlg').addEventListener('click', e => { if (e.target.id==='dlg') $('#dlg').close(); });
$('#dlg').addEventListener('close', () => { M = null; });

function applyTheme(){ if (S.theme==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = S.theme; }

window.addEventListener('hashchange', route);
applyTheme(); updateBadges(); route();
</script>
</body>
</html>
